# OAuth 2.1 authorization server; Cloudflare Access protects ONLY /authorize.
# Configure Cloudflare Zero Trust self-hosted Access application for auth host /authorize.
name = "chattoharness-auth"
main = "index.mjs"
compatibility_date = "2026-10-26"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_REAL_KV_ID"

[vars]
OAUTH_ISSUER = "https://auth.example.invalid"
MCP_RESOURCE_URL = "https://mcp.example.invalid/mcp"
ACCESS_ALLOWED_EMAILS = ""
