name: MCP paged result tool discovery
on:
  pull_request:
    branches:
      - feat/cloudflare-multi-device-router
    paths:
      - app/mcp-gateway.cjs
      - app/mcp-result-pages.cjs
      - tests/mcp-gateway.test.cjs
      - tests/mcp-result-pages.test.cjs
      - .github/workflows/paged-result-tools-smoke.yml
  push:
    branches:
      - feat/cloudflare-multi-device-router
    paths:
      - app/mcp-gateway.cjs
      - app/mcp-result-pages.cjs
      - tests/mcp-gateway.test.cjs
      - tests/mcp-result-pages.test.cjs
      - .github/workflows/paged-result-tools-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  result-tool-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate tools/list first-page recovery and immutable result paging
        run: node --test tests/mcp-gateway.test.cjs tests/mcp-result-pages.test.cjs
